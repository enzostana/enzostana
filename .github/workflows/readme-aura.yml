name: Generate profile README

on:
  push:
    branches: [main]
    paths:
      - README.source.md
      - scripts/build-readme.mjs
      - .github/workflows/readme-aura.yml
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Generate README and animated SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-readme.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile README"
            git push
          fi
